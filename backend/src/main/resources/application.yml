spring:
  application:
    name: meet-swps
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  mail:
    # Locally, Mailpit from compose.yaml catches every email (web inbox at http://localhost:8025).
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  docker:
    compose:
      # Starts PostgreSQL and Mailpit from the root compose file when running locally.
      file: ../compose.yaml
      lifecycle-management: start-only

app:
  jwt:
    # Base64 key of at least 256 bits; generate one with `openssl rand -base64 32`.
    # When unset, a random key is created at startup and sessions end on every restart.
    secret: ${JWT_SECRET:}
    issuer: meet-swps
    ttl: 30d
  registration:
    allowed-email-domains: st.swps.edu.pl,swps.edu.pl
    code-ttl: 30m
    resend-cooldown: 1m
    max-code-attempts: 5
  mail:
    from: ${MAIL_FROM:Meet SWPS <no-reply@meetswps.local>}
  privacy:
    # Version of the privacy policy users accept at sign-up. Change it together with
    # mobile/src/content/privacy-policy.ts whenever the policy text changes.
    policy-version: "1.0"
  roles:
    # Comma-separated addresses that get the admin role (moderator management).
    admin-emails: ${ADMIN_EMAILS:}
  moderation:
    # A profile is hidden until reviewed once this many students report it.
    auto-hide-threshold: 3
  cors:
    # Browser origins allowed to call the API: only the Expo web preview during development.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}
  storage:
    # Profile photos. Mount a persistent volume here in production.
    local-dir: ${STORAGE_DIR:./data/uploads}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
